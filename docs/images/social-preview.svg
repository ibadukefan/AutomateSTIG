<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AutomateSTIG difficult-device scanner</title>
  <desc id="desc">AutomateSTIG collects difficult-device STIG evidence and produces verified sparse handoffs for STIG Manager.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b9cff"/>
      <stop offset="1" stop-color="#6bc5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1135" cy="40" r="290" fill="#1d71b8" opacity="0.10"/>
  <circle cx="60" cy="630" r="250" fill="#2ca6ff" opacity="0.06"/>

  <g transform="translate(76 70)">
    <rect width="66" height="66" rx="16" fill="#122b45" stroke="#2c6b9f" stroke-width="2"/>
    <text x="33" y="42" fill="#dceeff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">AS</text>
    <text x="88" y="31" fill="#f4f8fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">AutomateSTIG</text>
    <text x="89" y="57" fill="#8fa9be" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Evidence-first scanner</text>
  </g>

  <g transform="translate(76 186)">
    <rect width="202" height="36" rx="18" fill="#123457" stroke="#2b72ab"/>
    <circle cx="20" cy="18" r="5" fill="#65c8ff"/>
    <text x="36" y="23" fill="#bfe7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">EXPERIMENTAL PILOT</text>
    <text x="0" y="98" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="760">Difficult-device STIG evidence</text>
    <text x="0" y="145" fill="#a9bfd1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">Verified sparse handoffs. STIG Manager stays the system of record.</text>
  </g>

  <g transform="translate(76 405)" filter="url(#shadow)">
    <g>
      <rect width="260" height="104" rx="18" fill="#101f30" stroke="#29415a"/>
      <text x="24" y="37" fill="#6fcaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">01 · COLLECT</text>
      <text x="24" y="70" fill="#edf6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="650">Read-only evidence</text>
    </g>
    <path d="M278 52h38" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="m307 43 10 9-10 9" fill="none" stroke="#65c8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(334)">
      <rect width="260" height="104" rx="18" fill="#101f30" stroke="#29415a"/>
      <text x="24" y="37" fill="#6fcaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">02 · VERIFY</text>
      <text x="24" y="70" fill="#edf6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="650">Deterministic result</text>
    </g>
    <path d="M612 52h38" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="m641 43 10 9-10 9" fill="none" stroke="#65c8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(668)">
      <rect width="260" height="104" rx="18" fill="#101f30" stroke="#29415a"/>
      <text x="24" y="37" fill="#6fcaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">03 · HANDOFF</text>
      <text x="24" y="70" fill="#edf6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="650">Scanner-owned reviews</text>
    </g>
  </g>

  <g transform="translate(76 558)">
    <rect width="142" height="38" rx="19" fill="#13263a" stroke="#29445e"/>
    <text x="71" y="25" fill="#b9d1e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle">NetApp ONTAP</text>
    <rect x="156" width="110" height="38" rx="19" fill="#13263a" stroke="#29445e"/>
    <text x="211" y="25" fill="#b9d1e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle">FreeBSD</text>
    <rect x="280" width="144" height="38" rx="19" fill="#13263a" stroke="#29445e"/>
    <text x="352" y="25" fill="#b9d1e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle">Cisco IOS-XE</text>
    <text x="1128" y="25" fill="#66839a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="end">Independent open-source project</text>
  </g>
</svg>
