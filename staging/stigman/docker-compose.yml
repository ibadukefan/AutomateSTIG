# STIG Manager staging rig for AutomateSTIG integration acceptance.
# Demo-grade credentials throughout — never expose beyond localhost/CI.
#
# Every image is pinned to an exact tag: this rig runs unattended weekly and a
# floating tag silently broke it (STIG Manager 1.6.17 refuses to start on
# MySQL 8.0.x: "MySQL release 8.0.46 is too old. Update to the latest 8.4.x").
# Bump deliberately, one image at a time, via workflow_dispatch.
services:
  auth:
    image: nuwcdivnpt/stig-manager-auth:26.0.6
    platform: linux/amd64
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no curl/wget guaranteed; use bash /dev/tcp + HTTP GET.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/stigman/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s

  db:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: stigman
      MYSQL_USER: stigman
      MYSQL_PASSWORD: stigman
    command: --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  api:
    image: nuwcdivnpt/stig-manager:1.6.17
    platform: linux/amd64
    environment:
      STIGMAN_OIDC_PROVIDER: http://auth:8080/realms/stigman
      STIGMAN_CLASSIFICATION: U
      STIGMAN_DB_HOST: db
      STIGMAN_DB_USER: stigman
      STIGMAN_DB_PASSWORD: stigman
      STIGMAN_DB_SCHEMA: stigman
      # Service-account tokens from Keycloak always carry `azp`; the default
      # (`clientId`) is not guaranteed on client-credentials tokens.
      STIGMAN_JWT_SERVICENAME_CLAIM: azp
    ports:
      - "54000:54000"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
