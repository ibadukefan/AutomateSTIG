name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Actions workflow linter
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP:?}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP:?}/actionlint-bin"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          chmod 0755 "$install_dir/actionlint"
          installed_version="$("$install_dir/actionlint" -version | sed -n '1p')"
          test "$installed_version" = "$ACTIONLINT_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate Actions workflow semantics
        run: actionlint
      - name: Enforce immutable workflow dependencies
        run: python3 scripts/validate-workflow-pins.py --repo-root .
      - name: Validate release approval evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATESTIG_GOVERNANCE_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "$GH_TOKEN" ]]; then
              echo "AUTOMATESTIG_GOVERNANCE_TOKEN is required for tag governance validation" >&2
              exit 1
            fi
            python3 scripts/validate-release-evidence.py --repo-root . --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/validate-release-evidence.py --repo-root . --schema-only
          fi
      - name: Enforce release feature freeze
        run: python3 scripts/validate-release-freeze.py --repo-root .

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - run: cargo test --workspace
      - name: Validate POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install-linux.sh install-macos.sh
      - name: Validate Windows unsupported-installer stub syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install-windows.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  e2e:
    name: E2E acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - run: cargo build --release --bin automatestig --bin automatestig-gui
      - name: Run E2E acceptance suite
        run: python3 scripts/e2e-acceptance.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend-syntax:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node --check crates/gui/frontend/app.js

  archive-fuzz-smoke:
    name: Archive fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          toolchain: nightly-2026-07-12
      - name: Install cargo-fuzz for the runner host
        run: cargo +nightly-2026-07-12 install cargo-fuzz --locked --version 0.13.2
      - name: Run bounded archive fuzz corpus and mutations
        run: >-
          cargo +nightly-2026-07-12 fuzz run
          safe_zip_archive fuzz/corpus/safe_zip_archive --
          -runs=100000 -max_len=4096 -timeout=2 -rss_limit_mb=1024
          -dict=fuzz/safe_zip_archive.dict

  coverage-validation:
    name: Coverage manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - run: python3 -m py_compile scripts/disa_corpus/*.py scripts/validate-check-packs.py
      - run: python3 scripts/validate-check-packs.py
      - run: python3 -m unittest discover -s scripts/disa_corpus/tests -v
      - run: python3 scripts/disa_corpus/index_disa_downloads.py --seed-only --output /tmp/disa-download-index.json
      - run: python3 scripts/validate-all-coverage.py --repo-root .
      - run: python3 scripts/validate-authorized-fixtures.py fixtures/authorized/manifest.example.json --repo-root .
      - run: python3 scripts/validate-authorized-fixtures.py content/disa-corpus/artifacts.manifest.json --repo-root .
      - run: python3 scripts/validate-external-workflows.py --repo-root .
      - run: python3 scripts/run-live-external-acceptance.py --repo-root .
      - run: python3 scripts/run-live-device-acceptance.py --repo-root .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@b3acd5417a6eccf7e7f11042455fe275eebb2fb9
      - run: cargo audit

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [governance, check, test, e2e, fmt, clippy, frontend-syntax, archive-fuzz-smoke, coverage-validation, dependency-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows remains in the test matrix above, but is intentionally not
          # a release target until equivalent ACL/reparse custody checks land.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: automatestig
            gui: automatestig-gui
            extension: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cli: automatestig
            gui: automatestig-gui
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cli: automatestig
            gui: automatestig-gui
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            cli: automatestig
            gui: automatestig-gui
            extension: tar.gz
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false
      - name: Install Linux ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin automatestig --bin automatestig-gui
      - name: Package the tested release binaries
        shell: bash
        run: |
          package="automatestig-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli }}" "dist/$package/"
          cp "target/${{ matrix.target }}/release/${{ matrix.gui }}" "dist/$package/"
          cp README.md LICENSE docs/quickstart.md docs/installation.md "dist/$package/"
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$package/*' -DestinationPath 'dist/$package.zip'"
          else
            tar -C "dist/$package" -czf "dist/$package.tar.gz" \
              "${{ matrix.cli }}" \
              "${{ matrix.gui }}" \
              README.md \
              LICENSE \
              quickstart.md \
              installation.md
          fi
          rm -rf "dist/$package"
          echo "PACKAGE=dist/$package.${{ matrix.extension }}" >> "$GITHUB_ENV"
      - name: Generate formal SBOM, dependency inventory, and provenance scaffold
        shell: bash
        run: |
          mkdir -p target/release/provenance
          cargo metadata --locked --format-version 1 > target/release/provenance/cargo-metadata-${{ matrix.target }}.json
          python3 scripts/generate-cyclonedx-sbom.py \
            --metadata target/release/provenance/cargo-metadata-${{ matrix.target }}.json \
            --output target/release/provenance/automatestig-${{ matrix.target }}.cdx.json \
            --target ${{ matrix.target }}
          cat > target/release/provenance/provenance-${{ matrix.target }}.json <<EOF
          {
            "artifact": "$(basename "$PACKAGE")",
            "target": "${{ matrix.target }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "sbom": "automatestig-${{ matrix.target }}.cdx.json"
          }
          EOF
      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          package_dir="$(dirname "$PACKAGE")"
          package_name="$(basename "$PACKAGE")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$package_dir" && sha256sum "$package_name" > "$package_name.sha256")
          else
            (cd "$package_dir" && shasum -a 256 "$package_name" > "$package_name.sha256")
          fi
      - name: Stage one flat, closed release-artifact set
        shell: bash
        run: |
          rm -rf release-upload
          mkdir release-upload
          cp "$PACKAGE" "$PACKAGE.sha256" release-upload/
          cp \
            "target/release/provenance/cargo-metadata-${{ matrix.target }}.json" \
            "target/release/provenance/automatestig-${{ matrix.target }}.cdx.json" \
            "target/release/provenance/provenance-${{ matrix.target }}.json" \
            release-upload/
          [[ "$(find release-upload -type f | wc -l | tr -d ' ')" == 5 ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automatestig-${{ matrix.target }}
          path: release-upload/
          retention-days: 14
          if-no-files-found: error

  live-binary-equivalence:
    name: Live-tested release binary
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: automatestig-x86_64-unknown-linux-gnu
          path: release-artifacts
      - name: Match the exact protected live-tested CLI bytes
        run: >-
          python3 scripts/validate-release-binary-equivalence.py
          --repo-root .
          --tag "$GITHUB_REF_NAME"
          --artifact-dir release-artifacts

  publish-release:
    name: Publish attested release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release, live-binary-equivalence]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: automatestig-*
          path: release-artifacts
          merge-multiple: true
      - name: Attest the exact archives selected for publication
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: release-artifacts/*.tar.gz
      - name: Install cosign for publication verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Generate keyless Sigstore bundles for the exact archives
        shell: bash
        run: |
          for archive in release-artifacts/*.tar.gz; do
            [[ -f "$archive" ]] || continue
            cosign sign-blob --yes \
              --bundle "$archive.sigstore.bundle" \
              "$archive"
          done
      - name: Cryptographically verify every release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
          for archive in release-artifacts/*.tar.gz; do
            [[ -f "$archive" ]] || continue
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
            cosign verify-blob \
              --bundle "$archive.sigstore.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$archive"
          done
      - name: Verify companions and generate release manifest
        shell: bash
        run: |
          python3 scripts/generate-release-manifest.py \
            --artifact-dir release-artifacts \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output release-artifacts/release-manifest.json
          (cd release-artifacts && sha256sum release-manifest.json > release-manifest.json.sha256)
      - name: Attest the final release manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: release-artifacts/release-manifest.json
      - name: Sign and verify the final release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=release-artifacts/release-manifest.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}"
          cosign sign-blob --yes \
            --bundle "$manifest.sigstore.bundle" \
            "$manifest"
          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
          cosign verify-blob \
            --bundle "$manifest.sigstore.bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$manifest"
      - name: Publish one immutable release with the exact gated artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
