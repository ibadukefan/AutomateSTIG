name: Handoff Receiver Ceremony

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Approved-commit STIG Manager handoff acceptance workflow run ID
        required: true
        type: string
      receiver_approver:
        description: GitHub login of the protected-environment receiver approver
        required: true
        type: string
      public_key_base64:
        description: Base64 of the independently conveyed raw 32-byte producer public key
        required: true
        type: string
      signature_sidecar_base64:
        description: Base64 of the detached sidecar created on the protected signing host
        required: true
        type: string
      key_custody_record_base64:
        description: Base64 of the non-secret handoff key-custody ceremony JSON
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: handoff-receiver-ceremony-${{ inputs.staging_run_id }}
  cancel-in-progress: false

jobs:
  verify-signed-handoff:
    name: Trusted receiver verifies producer signature
    runs-on: [self-hosted, linux, x64, automatestig-handoff-receiver]
    environment: handoff-receiver-ceremony
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure isolated build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP:?}/automatestig-handoff-receiver-${GITHUB_RUN_ID:?}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - name: Build reviewed receiver verifier
        run: >-
          cargo build --release --locked --no-default-features
          --bin automatestig
      - name: Download exact protected staging handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stig-manager-acceptance-${{ inputs.staging_run_id }}
          path: staging-handoff-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed handoff on protected receiver
        env:
          AUTOMATESTIG_HANDOFF_CEREMONY_PUBLIC_KEY_BASE64: ${{ inputs.public_key_base64 }}
          AUTOMATESTIG_HANDOFF_CEREMONY_SIGNATURE_BASE64: ${{ inputs.signature_sidecar_base64 }}
          AUTOMATESTIG_HANDOFF_CEREMONY_CUSTODY_BASE64: ${{ inputs.key_custody_record_base64 }}
          AUTOMATESTIG_HANDOFF_CEREMONY_REPOSITORY: ${{ github.repository }}
          AUTOMATESTIG_HANDOFF_CEREMONY_SOURCE_COMMIT: ${{ github.sha }}
          AUTOMATESTIG_HANDOFF_CEREMONY_WORKFLOW_RUN_ID: ${{ github.run_id }}
          AUTOMATESTIG_HANDOFF_CEREMONY_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          AUTOMATESTIG_HANDOFF_CEREMONY_KEY_CUSTODIAN: ${{ github.actor }}
          AUTOMATESTIG_HANDOFF_CEREMONY_RECEIVER_APPROVER: ${{ inputs.receiver_approver }}
        run: >-
          python3 scripts/run-handoff-receiver-ceremony.py
          --cli "$CARGO_TARGET_DIR/release/automatestig"
          --handoff staging-handoff-input/producer-handoff.zip
          --staging-evidence staging-handoff-input/stig-manager-acceptance.json
          --output-dir handoff-receiver-ceremony-output
          --repository "$AUTOMATESTIG_HANDOFF_CEREMONY_REPOSITORY"
          --source-commit "$AUTOMATESTIG_HANDOFF_CEREMONY_SOURCE_COMMIT"
          --workflow-run-id "$AUTOMATESTIG_HANDOFF_CEREMONY_WORKFLOW_RUN_ID"
          --staging-workflow-run-id "$AUTOMATESTIG_HANDOFF_CEREMONY_STAGING_RUN_ID"
          --key-custodian "$AUTOMATESTIG_HANDOFF_CEREMONY_KEY_CUSTODIAN"
          --receiver-approver "$AUTOMATESTIG_HANDOFF_CEREMONY_RECEIVER_APPROVER"
      - name: Upload fixed authenticated-handoff evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handoff-receiver-ceremony
          path: |
            handoff-receiver-ceremony-output/handoff-receiver-ceremony.json
            handoff-receiver-ceremony-output/handoff-producer-public-key.pub
            handoff-receiver-ceremony-output/producer-handoff.zip
            handoff-receiver-ceremony-output/producer-handoff.zip.signature.json
            handoff-receiver-ceremony-output/handoff-key-custody-ceremony.json
          retention-days: 90
          if-no-files-found: error
