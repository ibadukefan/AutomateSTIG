name: Transaction Recovery Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 1 */3 *"

permissions:
  contents: read

jobs:
  recovery-drill:
    name: Crash recovery and cross-process serialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.94.0
      - name: Exercise all durable recovery states
        run: >-
          python3 scripts/run-transaction-recovery-drill.py --repo-root .
          --output transaction-recovery-drill.json
          --log-output transaction-recovery-drill.log
      - name: Upload drill evidence and hashed log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: transaction-recovery-drill-${{ github.run_id }}
          path: |
            transaction-recovery-drill.json
            transaction-recovery-drill.log
          retention-days: 90
          if-no-files-found: error
