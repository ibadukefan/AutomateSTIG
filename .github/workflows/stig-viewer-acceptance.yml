name: STIG Viewer Acceptance

on:
  workflow_dispatch:
    inputs:
      ckl_source:
        description: Absolute runner path to AutomateSTIG's source CKL
        required: true
      ckl_roundtrip:
        description: Absolute runner path to the CKL saved by the real STIG Viewer
        required: true
      cklb_source:
        description: Absolute runner path to AutomateSTIG's source CKLB
        required: true
      cklb_roundtrip:
        description: Absolute runner path to the CKLB saved by the real STIG Viewer
        required: true
      product_version:
        description: Exact STIG Viewer version shown by the application
        required: true
      platform:
        description: Workstation OS and architecture
        required: true
      operator:
        description: Named human who performed the GUI import/save round trips
        required: true

permissions:
  contents: read

jobs:
  stig-viewer-acceptance:
    name: Real CKL and CKLB GUI round-trip
    runs-on: [self-hosted, automatestig-stig-viewer]
    environment: external-acceptance
    timeout-minutes: 30
    env:
      AUTOMATESTIG_PROTECTED_ENVIRONMENT: external-acceptance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: cargo build --release --locked --bin automatestig
      - name: Compare real Viewer round trips with exact modeled semantics
        shell: bash
        env:
          CKL_SOURCE: ${{ inputs.ckl_source }}
          CKL_ROUNDTRIP: ${{ inputs.ckl_roundtrip }}
          CKLB_SOURCE: ${{ inputs.cklb_source }}
          CKLB_ROUNDTRIP: ${{ inputs.cklb_roundtrip }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          VIEWER_PLATFORM: ${{ inputs.platform }}
          VIEWER_OPERATOR: ${{ inputs.operator }}
        run: |
          python3 scripts/run-stig-viewer-acceptance.py \
            --repo-root . \
            --binary target/release/automatestig \
            --ckl-source "$CKL_SOURCE" \
            --ckl-roundtrip "$CKL_ROUNDTRIP" \
            --cklb-source "$CKLB_SOURCE" \
            --cklb-roundtrip "$CKLB_ROUNDTRIP" \
            --product-version "$PRODUCT_VERSION" \
            --platform "$VIEWER_PLATFORM" \
            --operator "$VIEWER_OPERATOR" \
            --output stig-viewer-acceptance.json
      - name: Upload redacted acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stig-viewer-acceptance-${{ github.run_id }}
          path: stig-viewer-acceptance.json
          retention-days: 90
          if-no-files-found: error
