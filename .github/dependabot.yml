version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      rust-security-maintenance:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /staging/stigman
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
