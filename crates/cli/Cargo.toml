[package]
name = "automatestig"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AutomateSTIG difficult-device scanner and evidence handoff CLI"

[[bin]]
name = "automatestig"
path = "src/main.rs"

[[bin]]
name = "automatestig-transition"
path = "src/bin/automatestig-transition.rs"
required-features = ["transition"]

[features]
default = []
# Protected release-engineering utilities. Official analyst binaries are
# built without this feature and therefore do not contain mutable catalog or
# broad content-import commands.
maintainer = []
# Deliberately separate transition/custody executable. Product builds do not
# contain migration export or signing-key operations.
transition = []

[dependencies]
automatestig-core = { workspace = true }
automatestig-archive-safety = { workspace = true }
automatestig-collector = { workspace = true }
automatestig-parsers = { workspace = true }
automatestig-scanner = { workspace = true }
automatestig-storage = { workspace = true }
automatestig-stigpack = { workspace = true }
automatestig-integrations = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
console = { workspace = true }
sha2.workspace = true
tokio = { workspace = true }
same-file = { workspace = true }
unicode-normalization = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
