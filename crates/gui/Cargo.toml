[package]
name = "automatestig-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AutomateSTIG difficult-device scanner and evidence handoff GUI"

[[bin]]
name = "automatestig-gui"
path = "src/main.rs"

[dependencies]
automatestig-core = { workspace = true }
automatestig-collector = { workspace = true }
automatestig-integrations = { workspace = true }
automatestig-parsers = { workspace = true }
automatestig-scanner = { workspace = true }
automatestig-storage = { workspace = true }
automatestig-stigpack = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { workspace = true }
ed25519-dalek = { workspace = true }
